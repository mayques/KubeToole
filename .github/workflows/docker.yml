name: Build and Publish Docker Image
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./calculator
          push: true
          tags: |
            ghcr.io/mayques/kubetoole-calculator:${{ github.sha }}
            ghcr.io/mayques/kubetoole-calculator:latest
