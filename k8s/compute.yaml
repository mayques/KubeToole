apiVersion: v1
kind: Namespace
metadata:
  name: kubetoole-compute
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-capacity
  namespace: kubetoole-compute
spec:
  hard:
    pods: "2"
    requests.cpu: "2500m"
    limits.cpu: "2500m"
    requests.memory: "6Gi"
    limits.memory: "6Gi"
    requests.ephemeral-storage: "128Mi"
    limits.ephemeral-storage: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: kubetoole-compute
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubetoole-api
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manage-tool-jobs
  namespace: kubetoole-compute
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubetoole-api-jobs
  namespace: kubetoole-compute
subjects:
  - kind: ServiceAccount
    name: kubetoole-api
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manage-tool-jobs
